<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Industria Monir — Tradición Textil, Hilatura & Fibras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --color-black: #141413;
      --color-charcoal: #1F1F1D;
      --color-dark-gray: #2B2A27;
      --color-gray: #686762;
      --color-medium-gray: #9E9C95;
      --color-warm-brown: #8C6D46;
      --color-brown: #A68759;
      --color-tan: #C4A77D;
      --color-sand: #DDD0C0;
      --color-cream: #F2ECE1;
      --color-off-white: #FAF7F2;
      --color-white: #FFFFFF;

      --font-display: 'EB Garamond', Georgia, serif;
      --font-elegant: 'Lora', Garamond, serif;
      --font-body: 'DM Sans', -apple-system, sans-serif;

      --nav-height: 76px;
      --transition-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --transition-cinema: cubic-bezier(0.77, 0, 0.175, 1);
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
      overflow-x: hidden;
      background: var(--color-black);
      color: var(--color-off-white);
    }

    body {
      font-family: var(--font-body);
      background: var(--color-off-white);
      color: var(--color-charcoal);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* Textura micro-grain sutil para realismo */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--color-black); }
    ::-webkit-scrollbar-thumb { background: var(--color-warm-brown); border-radius: 2px; }

    /* ============================================
       INTRO LOADER ELEGANTE
       ============================================ */
    .loader-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: var(--color-black);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s var(--transition-cinema), transform 0.8s var(--transition-cinema);
    }
    .loader-overlay.fade-out {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }
    .loader-logo {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 400;
      letter-spacing: 0.28em;
      color: var(--color-tan);
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(24px);
      animation: loaderFadeIn 1s var(--transition-cinema) 0.2s forwards;
    }
    .loader-line {
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--color-tan), transparent);
      margin-top: 20px;
      animation: loaderLine 1.4s var(--transition-cinema) 0.6s forwards;
    }
    .loader-subtitle {
      font-family: var(--font-body);
      font-size: 0.68rem;
      font-weight: 400;
      color: var(--color-medium-gray);
      letter-spacing: 0.45em;
      text-transform: uppercase;
      margin-top: 18px;
      opacity: 0;
      animation: loaderFadeIn 0.8s var(--transition-cinema) 1.2s forwards;
    }
    @keyframes loaderFadeIn { to { opacity: 1; transform: translateY(0); } }
    @keyframes loaderLine { to { width: 160px; } }

    /* ============================================
       TRANSICIÓN CINEMÁTICA ENTRE SUB-PORTALES (100% RESPONSIVE)
       ============================================ */
    .portal-transition-curtain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      width: 100dvw;
      height: 100vh;
      height: 100dvh;
      z-index: 99990;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .curtain-panel-top, .curtain-panel-bottom {
      width: 100%;
      height: 0%;
      background: #0D0D0C;
      position: relative;
      will-change: height;
    }
    .curtain-panel-top { 
      top: 0; 
      border-bottom: 1px solid rgba(196,167,125,0.3); 
    }
    .curtain-panel-bottom { 
      bottom: 0; 
      margin-top: auto; 
      border-top: 1px solid rgba(196,167,125,0.3); 
    }

    .curtain-brand-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--font-display);
      font-size: clamp(1.2rem, 5.5vw, 2.5rem);
      letter-spacing: clamp(0.12em, 2vw, 0.28em);
      text-transform: uppercase;
      color: var(--color-tan);
      opacity: 0;
      z-index: 99995;
      pointer-events: none;
      text-align: center;
      width: 90%;
      max-width: 480px;
      word-break: break-word;
      line-height: 1.2;
    }

    /* ============================================
       NAVBAR & DRAWER RESPONSIVE
       ============================================ */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px, 4vw, 60px);
      transition: all 0.4s var(--transition-smooth);
      border-bottom: 1px solid transparent;
    }
    .navbar.scrolled {
      background: rgba(20, 20, 19, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom-color: rgba(196, 167, 125, 0.15);
    }
    .nav-brand {
      font-family: var(--font-display);
      font-size: 1.7rem;
      font-weight: 500;
      color: var(--color-white);
      letter-spacing: 0.18em;
      cursor: pointer;
      text-decoration: none;
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .nav-brand span.sub {
      font-family: var(--font-body);
      font-size: 0.58rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--color-tan);
      margin-top: 2px;
      font-weight: 400;
    }
    
    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(16px, 2.5vw, 36px);
      list-style: none;
    }
    .nav-link {
      font-family: var(--font-body);
      font-size: 0.76rem;
      font-weight: 400;
      color: rgba(255,255,255,0.72);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      cursor: pointer;
      transition: color 0.3s;
      position: relative;
      padding: 6px 0;
      background: none;
      border: none;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--color-tan);
      transition: width 0.35s var(--transition-smooth);
    }
    .nav-link:hover { color: var(--color-white); }
    .nav-link:hover::after { width: 100%; }
    .nav-link.active { color: var(--color-tan); }
    .nav-link.active::after { width: 100%; }

    .nav-cta {
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--color-black);
      background: var(--color-tan);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      padding: 11px 24px;
      border: none;
      cursor: pointer;
      transition: all 0.35s var(--transition-smooth);
      min-height: 42px;
      display: inline-flex;
      align-items: center;
    }
    .nav-cta:hover {
      background: var(--color-white);
      transform: translateY(-1px);
    }

    /* Botón Hamburguesa Táctil (Mínimo 48px) */
    .burger-btn {
      display: none;
      width: 48px;
      height: 48px;
      background: transparent;
      border: none;
      cursor: pointer;
      position: relative;
      z-index: 1010;
      align-items: center;
      justify-content: center;
    }
    .burger-box {
      width: 24px;
      height: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .burger-bar {
      width: 100%;
      height: 1.5px;
      background: var(--color-white);
      transition: all 0.35s var(--transition-smooth);
      transform-origin: center;
    }
    .burger-btn.open .burger-bar:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
      background: var(--color-tan);
    }
    .burger-btn.open .burger-bar:nth-child(2) { opacity: 0; }
    .burger-btn.open .burger-bar:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
      background: var(--color-tan);
    }

    /* Drawer Mobile con desenfoque */
    .mobile-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(85vw, 380px);
      height: 100dvh;
      background: rgba(20, 20, 19, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 1005;
      padding: 95px 30px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transform: translateX(100%);
      transition: transform 0.45s var(--transition-cinema);
      border-left: 1px solid rgba(196,167,125,0.18);
    }
    .mobile-drawer.open {
      transform: translateX(0%);
    }
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 1004;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s var(--transition-smooth);
    }
    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .drawer-nav-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .drawer-link-btn {
      background: none;
      border: none;
      text-align: left;
      font-family: var(--font-display);
      font-size: 1.55rem;
      color: rgba(255,255,255,0.8);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: all 0.3s;
    }
    .drawer-link-btn span.num {
      font-family: var(--font-body);
      font-size: 0.72rem;
      color: var(--color-warm-brown);
    }
    .drawer-link-btn.active, .drawer-link-btn:hover {
      color: var(--color-tan);
      transform: translateX(6px);
    }

    @media (max-width: 992px) {
      .nav-links { display: none; }
      .burger-btn { display: flex; }
    }

    /* ============================================
       HERO PRINCIPAL & INNER HEROES (100dvh)
       ============================================ */
    .hero {
      position: relative;
      width: 100%;
      min-height: 90dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: calc(var(--nav-height) + 20px) 24px 60px;
      background: var(--color-black);
    }
    .hero.sub-hero {
      min-height: 52dvh;
      padding-top: calc(var(--nav-height) + 30px);
      padding-bottom: 40px;
      background: linear-gradient(180deg, #1C1B19 0%, var(--color-black) 100%);
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 35%, #2B2A26 0%, #141413 70%);
      opacity: 0.95;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(20,20,19,0.5) 0%, rgba(20,20,19,0.85) 100%);
    }
    .hero-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.45;
    }
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 920px;
      margin: 0 auto;
    }
    .hero-eyebrow {
      font-family: var(--font-body);
      font-size: 0.7rem;
      font-weight: 400;
      color: var(--color-tan);
      text-transform: uppercase;
      letter-spacing: 0.42em;
      margin-bottom: 22px;
    }
    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(2.6rem, 6.5vw, 5.2rem);
      font-weight: 400;
      color: var(--color-white);
      line-height: 1.08;
      margin-bottom: 18px;
    }
    .hero-title em {
      font-family: var(--font-elegant);
      font-weight: 400;
      font-style: italic;
      color: var(--color-sand);
    }
    .hero-subtitle {
      font-family: var(--font-elegant);
      font-size: clamp(1.1rem, 2.2vw, 1.45rem);
      font-weight: 400;
      font-style: italic;
      color: rgba(255,255,255,0.72);
      margin-bottom: 24px;
    }
    .hero-line {
      width: 50px;
      height: 1px;
      background: var(--color-tan);
      margin: 24px auto;
    }
    .hero-desc {
      font-family: var(--font-body);
      font-size: 0.92rem;
      font-weight: 300;
      color: rgba(255,255,255,0.65);
      line-height: 1.8;
      max-width: 540px;
      margin: 0 auto 36px;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
      font-size: 0.74rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--color-black);
      background: var(--color-tan);
      padding: 14px 34px;
      border: 1px solid var(--color-tan);
      cursor: pointer;
      transition: all 0.35s var(--transition-smooth);
      min-height: 48px;
      text-decoration: none;
    }
    .btn-primary:hover {
      background: var(--color-white);
      border-color: var(--color-white);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.25);
    }
    .btn-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
      font-size: 0.74rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--color-tan);
      background: transparent;
      padding: 14px 32px;
      border: 1px solid rgba(196, 167, 125, 0.4);
      cursor: pointer;
      transition: all 0.35s var(--transition-smooth);
      min-height: 48px;
      text-decoration: none;
    }
    .btn-outline:hover {
      background: rgba(196, 167, 125, 0.1);
      border-color: var(--color-tan);
      color: var(--color-white);
    }

    @media (max-width: 540px) {
      .btn-group { flex-direction: column; width: 100%; }
      .btn-primary, .btn-outline { width: 100%; }
    }

    /* ============================================
       MARQUEE CORPORATIVO
       ============================================ */
    .marquee-wrapper {
      overflow: hidden;
      padding: 24px 0;
      background: var(--color-black);
      border-top: 1px solid rgba(196, 167, 125, 0.15);
      border-bottom: 1px solid rgba(196, 167, 125, 0.15);
    }
    .marquee-track {
      display: flex;
      gap: 60px;
      animation: marqueeRun 28s linear infinite;
      width: max-content;
    }
    .marquee-item {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.4);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 60px;
      text-transform: uppercase;
    }
    .marquee-item span.dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--color-tan);
      opacity: 0.6;
    }
    @keyframes marqueeRun {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* ============================================
       SECCIONES GENERALES
       ============================================ */
    .section {
      padding: clamp(65px, 9vw, 120px) clamp(20px, 5vw, 60px);
      position: relative;
    }
    .section-dark {
      background: var(--color-black);
      color: var(--color-white);
    }
    .section-cream {
      background: var(--color-cream);
      color: var(--color-charcoal);
    }
    .section-white {
      background: var(--color-white);
      color: var(--color-charcoal);
    }
    .section-charcoal {
      background: var(--color-charcoal);
      color: var(--color-white);
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .section-header {
      text-align: center;
      margin-bottom: clamp(40px, 6vw, 75px);
    }
    .section-eyebrow {
      font-family: var(--font-body);
      font-size: 0.68rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      color: var(--color-warm-brown);
      margin-bottom: 12px;
      display: block;
    }
    .section-dark .section-eyebrow,
    .section-charcoal .section-eyebrow {
      color: var(--color-tan);
    }
    .section-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 16px;
    }
    .section-title em {
      font-family: var(--font-elegant);
      font-style: italic;
      color: var(--color-warm-brown);
    }
    .section-dark .section-title em,
    .section-charcoal .section-title em {
      color: var(--color-sand);
    }
    .section-line {
      width: 44px;
      height: 1px;
      background: var(--color-tan);
      margin: 18px auto;
    }
    .section-subtitle {
      font-family: var(--font-elegant);
      font-size: 1.1rem;
      font-weight: 400;
      font-style: italic;
      color: var(--color-gray);
      max-width: 580px;
      margin: 0 auto;
      line-height: 1.7;
    }
    .section-dark .section-subtitle,
    .section-charcoal .section-subtitle {
      color: rgba(255,255,255,0.6);
    }

    /* ============================================
       PRODUCT CARDS (Estilo Fiel al Original)
       ============================================ */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: clamp(24px, 3vw, 36px);
    }
    .product-card {
      background: var(--color-white);
      border: 1px solid rgba(196, 167, 125, 0.18);
      overflow: hidden;
      transition: transform 0.4s var(--transition-smooth), box-shadow 0.4s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .section-dark .product-card,
    .section-charcoal .product-card {
      background: #1B1B19;
    }
    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      border-color: var(--color-tan);
    }
    .product-card-image {
      width: 100%;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #161614;
      border-bottom: 1px solid rgba(196, 167, 125, 0.1);
    }
    .product-card-content {
      padding: clamp(24px, 3vw, 36px);
    }
    .product-card-tag {
      font-family: var(--font-body);
      font-size: 0.65rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.24em;
      color: var(--color-warm-brown);
      margin-bottom: 12px;
    }
    .section-dark .product-card-tag,
    .section-charcoal .product-card-tag {
      color: var(--color-tan);
    }
    .product-card-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 400;
      margin-bottom: 12px;
    }
    .product-card-desc {
      font-family: var(--font-body);
      font-size: 0.88rem;
      line-height: 1.7;
      color: var(--color-gray);
      margin-bottom: 24px;
      font-weight: 300;
    }
    .section-dark .product-card-desc,
    .section-charcoal .product-card-desc {
      color: rgba(255,255,255,0.65);
    }
    .product-card-link {
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--color-warm-brown);
      background: none;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: gap 0.3s;
      padding: 0;
    }
    .section-dark .product-card-link,
    .section-charcoal .product-card-link {
      color: var(--color-tan);
    }
    .product-card-link:hover {
      gap: 14px;
    }

    /* ============================================

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ============================================
    // DIBUJOS ABSTRACTOS VECTORIALES DE FIBRA
    // ============================================
    const ArtThread = () => (
      <svg viewBox="0 0 400 300" fill="none" style={{ width: '100%', height: '100%', opacity: 0.7 }}>
        <ellipse cx="200" cy="150" rx="90" ry="120" stroke="#C4A77D" strokeWidth="1" />
        <ellipse cx="200" cy="150" rx="45" ry="75" stroke="#8C6D46" strokeWidth="0.8" />
        <line x1="200" y1="20" x2="200" y2="280" stroke="#C4A77D" strokeWidth="1" strokeDasharray="3 3" />
        <line x1="50" y1="150" x2="350" y2="150" stroke="#C4A77D" strokeWidth="0.5" opacity="0.4" />
      </svg>
    );

    const ArtCotton = () => (
      <svg viewBox="0 0 400 300" fill="none" style={{ width: '100%', height: '100%', opacity: 0.7 }}>
        <circle cx="200" cy="130" r="50" stroke="#C4A77D" strokeWidth="1" />
        <circle cx="150" cy="150" r="40" stroke="#DDD0C0" strokeWidth="0.8" />
        <circle cx="250" cy="150" r="40" stroke="#8C6D46" strokeWidth="0.8" />
        <line x1="200" y1="190" x2="200" y2="270" stroke="#C4A77D" strokeWidth="1.5" />
      </svg>
    );

    const ArtPavilo = () => (
      <svg viewBox="0 0 400 300" fill="none" style={{ width: '100%', height: '100%', opacity: 0.7 }}>
        <path d="M60 150 Q130 50 200 150 T340 150" stroke="#C4A77D" strokeWidth="1.2" />
        <path d="M60 170 Q130 70 200 170 T340 170" stroke="#8C6D46" strokeWidth="0.8" opacity="0.6" />
        <rect x="160" y="100" width="80" height="100" stroke="#DDD0C0" strokeWidth="0.8" opacity="0.4" />
      </svg>
    );

    // ============================================
    // CANVAS HERO: HILOS INTERACTIVOS (ASTEROIDES / RED FIBRA)
    // ============================================
    const FiberFieldCanvas = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        let width = canvas.width = canvas.parentElement.offsetWidth;
        let height = canvas.height = canvas.parentElement.offsetHeight;

        const onResize = () => {
          if (!canvas.parentElement) return;
          width = canvas.width = canvas.parentElement.offsetWidth;
          height = canvas.height = canvas.parentElement.offsetHeight;
        };
        window.addEventListener('resize', onResize);

        const nodes = Array.from({ length: 28 }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.45,
          vy: (Math.random() - 0.5) * 0.45,
          radius: Math.random() * 1.8 + 0.6
        }));

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          nodes.forEach(n => {
            n.x += n.vx;
            n.y += n.vy;
            if (n.x < 0 || n.x > width) n.vx *= -1;
            if (n.y < 0 || n.y > height) n.vy *= -1;

            ctx.beginPath();
            ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(196, 167, 125, 0.4)';
            ctx.fill();
          });

          for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
              const dx = nodes[i].x - nodes[j].x;
              const dy = nodes[i].y - nodes[j].y;
              const dist = Math.hypot(dx, dy);

              if (dist < 160) {
                const alpha = (1 - dist / 160) * 0.25;
                ctx.strokeStyle = `rgba(196, 167, 125, ${alpha})`;
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(nodes[i].x, nodes[i].y);
                ctx.lineTo(nodes[j].x, nodes[j].y);
                ctx.stroke();
              }
            }
          }

          animId = requestAnimationFrame(render);
        };
        render();

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('resize', onResize);
        };
      }, []);

      return <canvas ref={canvasRef} className="hero-canvas" />;
    };

    // ============================================
    // LOADER INICIAL
    // ============================================
    const Loader = ({ onComplete }) => {
      const [fadeOut, setFadeOut] = useState(false);

      useEffect(() => {
        const timer = setTimeout(() => {
          setFadeOut(true);
          setTimeout(onComplete, 800);
        }, 1600);
        return () => clearTimeout(timer);
      }, [onComplete]);

      return (
        <div className={`loader-overlay ${fadeOut ? 'fade-out' : ''}`}>
          <div className="loader-logo">Monir</div>
          <div className="loader-line" />
          <div className="loader-subtitle">Industria Textil</div>
        </div>
      );
    };

    // ============================================
    // NAVBAR Y MENÚ MOBILE
    // ============================================

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 40);
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const pages = [
        { id: 'inicio', label: 'Inicio' },
        { id: 'nosotros', label: 'Nosotros' },
        { id: 'productos', label: 'Productos' },
        { id: 'procesos', label: 'Procesos' },
        { id: 'clientes', label: 'Clientes' },
        { id: 'contacto', label: 'Contacto' },

      const handleNav = (id) => {
        setDrawerOpen(false);
        onNavigate(id);
      };

                  >
                    {p.label}
                  </button>
                </li>
              ))}
              <li>
                <button className="nav-cta" onClick={() => handleNav('contacto')}>
                  Cotizar
                </button>
              </li>
            </ul>

            <button
              className={`burger-btn ${drawerOpen ? 'open' : ''}`}
              onClick={() => setDrawerOpen(!drawerOpen)}
              aria-label="Menú de Navegación"
            >
              <div className="burger-box">
                <span className="burger-bar" />
                <span className="burger-bar" />
                <span className="burger-bar" />
              </div>
            </button>
          </nav>

          <div 
            className={`drawer-backdrop ${drawerOpen ? 'open' : ''}`} 
            onClick={() => setDrawerOpen(false)} 
          />

          <aside className={`mobile-drawer ${drawerOpen ? 'open' : ''}`}>
            <div className="drawer-nav-list">
              <div style={{ fontSize: '0.68rem', letterSpacing: '0.28em', textTransform: 'uppercase', color: 'var(--color-tan)', marginBottom: '8px' }}>
                Navegación
              </div>
              {pages.map((p, i) => (
                <button
                  key={p.id}
                  className={`drawer-link-btn ${activePage === p.id ? 'active' : ''}`}
                  onClick={() => handleNav(p.id)}
                >
                  <span>{p.label}</span>
                  <span className="num">0{i + 1}</span>
                </button>
              ))}
            </div>

            <div style={{ borderTop: '1px solid rgba(255,255,255,0.06)', paddingTop: '20px' }}>
              <button 
                className="btn-primary" 
                style={{ width: '100%' }}
                onClick={() => handleNav('contacto')}
              >
                Solicitar Cotización
              </button>
            </div>
          </aside>
        </>
      );
    };

    // ============================================
    // MARQUEE TEXTIL
    // ============================================
    const Marquee = () => {
      const items = [
        'Algodón Seleccionado', 'Hilo Industrial', 'Pavilo Calibrado',
        'Suministro Masivo B2B', 'Tradición Textil', 'Manufactura de Precisión',
        'Algodón Seleccionado', 'Hilo Industrial', 'Pavilo Calibrado',
        'Suministro Masivo B2B', 'Tradición Textil', 'Manufactura de Precisión'
      ];
      return (
        <div className="marquee-wrapper">
          <div className="marquee-track">
            {items.map((txt, i) => (
              <div className="marquee-item" key={i}>
                {txt}

              </div>
            ))}
          </div>
        </div>
      );
    };

    // ============================================
    // SUB-PORTAL 1: INICIO
    // ============================================
    const PortalInicio = ({ onNavigate }) => {
      return (
        <div>
          <section className="hero">
            <div className="hero-bg" />
            <FiberFieldCanvas />
            <div className="hero-overlay" />
            <div className="hero-content">
              <div className="hero-eyebrow">Industria Textil de Excelencia</div>
              <h1 className="hero-title">
                Industria <em>Monir</em>
              </h1>
              <p className="hero-subtitle">El hilo que conecta tradición con industria</p>
              <div className="hero-line" />
              <p className="hero-desc">

              <div className="btn-group">
                <button className="btn-primary" onClick={() => onNavigate('productos')}>

                  Solicitar Cotización
                </button>
              </div>
            </div>
          </section>

          <Marquee />

          {/* SOBRE MONIR PREVIEW */}
          <section className="section section-white">
            <div className="container">
              <div className="two-col">
                <div className="two-col-text">
                  <span className="section-eyebrow">Quiénes Somos</span>
                  <h3>Una tradición que se teje con <em>excelencia</em></h3>
                  <p>
                    Industria Monir es sinónimo de solidez en el sector textil. Nos especializamos en la producción de algodón, hilo y pavilo de grado industrial, atendiendo a empresas manufactureras que demandan altos estándares en sus materias primas.
                  </p>
                  <p>
                    Con una visión clara de suministro masivo para el sector B2B, combinamos métodos probados con maquinaria moderna para que cada entrega mantenga la uniformidad que su telar necesita.
                  </p>
                  <div className="btn-group" style={{ justifyContent: 'flex-start', marginTop: '24px' }}>
                    <button className="btn-primary" onClick={() => onNavigate('nosotros')}>
                      Nuestra Historia
                    </button>
                  </div>
                </div>

                <div className="art-placeholder">
                  <ArtCotton />
                </div>
              </div>
            </div>
          </section>

          {/* PRODUCTOS PREVIEW */}
          <section className="section section-cream">
            <div className="container">
              <div className="section-header">
                <span className="section-eyebrow">Nuestros Productos</span>
                <h2 className="section-title">Materias primas de <em>calidad superior</em></h2>
                <div className="section-line" />
                <p className="section-subtitle">
                  Tres líneas de producto diseñadas para satisfacer las demandas más exigentes del sector textil industrial
                </p>
              </div>

              <div className="products-grid">
                <div className="product-card">

                  <div className="product-card-content">

                    <h3 className="product-card-title">Algodón</h3>

                  <div className="product-card-content">
